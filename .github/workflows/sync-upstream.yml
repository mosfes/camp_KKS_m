name: Sync upstream main

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mosfes/camp_KKS_m' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out destination main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/yveszangpat/camp.git main
          upstream_sha=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'Destination already contains upstream main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge --no-edit "$upstream_sha"; then
            git merge --abort
            echo '::error::Upstream merge conflicted. Resolve the conflict in main manually; destination was not pushed.'
            exit 1
          fi

          # A normal push preserves destination commits and rejects concurrent changes.
          git push origin HEAD:refs/heads/main
          echo "Synced yveszangpat/camp main at $upstream_sha into destination main." >> "$GITHUB_STEP_SUMMARY"
